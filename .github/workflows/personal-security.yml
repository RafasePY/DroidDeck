name: Personal security checks
on:
  push:
    branches:
      - 'personal/**'
  pull_request:
    branches: [dev]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify personal profile policy
        run: python3 tools/personal/check_security.py
